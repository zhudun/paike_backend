spring.datasource.url=jdbc:mysql://localhost:3306/course_scheduling_prod?useUnicode=true&characterEncoding=utf8&serverTimezone=GMT%2B8&useSSL=true
spring.datasource.username=${DB_USERNAME:course_admin}
spring.datasource.password=${DB_PASSWORD:your_secure_password}

# 生产环境日志级别
logging.level.com.paikesystem.mapper=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=INFO

# 生产环境配置
server.tomcat.max-connections=8192
server.tomcat.accept-count=100
server.tomcat.max-threads=200
server.tomcat.min-spare-threads=10

# 连接池配置
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000